name: CD - Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.2.3)"
        required: true
        type: string
      skip_approval:
        description: "Skip manual approval gate"
        required: false
        type: boolean
        default: false

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ github.event.inputs.version }}

jobs:
  build-push:
    name: Build & Tag Release Images
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image-tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/finshield-backend:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/finshield-backend:latest
          cache-from: type=gha,scope=backend-prod
          cache-to: type=gha,mode=max,scope=backend-prod

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/finshield-frontend:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/finshield-frontend:latest
          cache-from: type=gha,scope=frontend-prod
          cache-to: type=gha,mode=max,scope=frontend-prod

  deploy-green:
    name: Deploy Green Revision
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ github.event.inputs.skip_approval == 'true' && 'production-auto' || 'production' }}
    outputs:
      green-fqdn: ${{ steps.deploy-backend.outputs.green-fqdn }}
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend green revision
        id: deploy-backend
        run: |
          az containerapp revision copy \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/finshield-backend:${{ needs.build-push.outputs.image-tag }} \
            --revision-suffix green-${{ github.run_number }}

          az containerapp ingress traffic set \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }}=0

          green_fqdn=$(az containerapp revision show \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision ${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }} \
            --query "properties.fqdn" -o tsv)
          echo "green-fqdn=$green_fqdn" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend green revision
        run: |
          az containerapp revision copy \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/finshield-frontend:${{ needs.build-push.outputs.image-tag }} \
            --revision-suffix green-${{ github.run_number }}

          az containerapp ingress traffic set \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.FRONTEND_APP_NAME }}--green-${{ github.run_number }}=0

  health-check-green:
    name: Health Check Green Revision
    runs-on: ubuntu-latest
    needs: deploy-green
    steps:
      - name: Verify green revision health
        run: |
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ needs.deploy-green.outputs.green-fqdn }}/health" || true)
            if [ "$status" = "200" ]; then
              echo "Green revision health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 10s..."
            sleep 10
          done
          echo "Green revision health check failed"
          exit 1

  traffic-shift:
    name: Gradual Traffic Shift
    runs-on: ubuntu-latest
    needs: [deploy-green, health-check-green]
    environment: production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Shift 10% traffic to green
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }}=10
          az containerapp ingress traffic set \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.FRONTEND_APP_NAME }}--green-${{ github.run_number }}=10
          echo "10% traffic shifted, monitoring for 60s..."
          sleep 60

      - name: Verify at 10%
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ needs.deploy-green.outputs.green-fqdn }}/health")
          if [ "$status" != "200" ]; then
            echo "Health check failed at 10% traffic"
            exit 1
          fi

      - name: Shift 50% traffic to green
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }}=50
          az containerapp ingress traffic set \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.FRONTEND_APP_NAME }}--green-${{ github.run_number }}=50
          echo "50% traffic shifted, monitoring for 60s..."
          sleep 60

      - name: Verify at 50%
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ needs.deploy-green.outputs.green-fqdn }}/health")
          if [ "$status" != "200" ]; then
            echo "Health check failed at 50% traffic"
            exit 1
          fi

      - name: Shift 100% traffic to green
        run: |
          az containerapp ingress traffic set \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }}=100
          az containerapp ingress traffic set \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision-weight \
              ${{ secrets.FRONTEND_APP_NAME }}--green-${{ github.run_number }}=100
          echo "100% traffic on green revision"

      - name: Deactivate old revisions
        run: |
          old_revisions=$(az containerapp revision list \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.trafficWeight==\`0\`].name" -o tsv)
          for rev in $old_revisions; do
            az containerapp revision deactivate \
              --name ${{ secrets.BACKEND_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --revision "$rev" || true
          done

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [deploy-green, health-check-green, traffic-shift]
    if: failure()
    environment: production
    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Rollback backend to blue
        run: |
          active_revisions=$(az containerapp revision list \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active && !contains(name, 'green-${{ github.run_number }}')].name | [0]" -o tsv)

          if [ -n "$active_revisions" ]; then
            az containerapp ingress traffic set \
              --name ${{ secrets.BACKEND_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --revision-weight "${active_revisions}=100"
          fi

          az containerapp revision deactivate \
            --name ${{ secrets.BACKEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision "${{ secrets.BACKEND_APP_NAME }}--green-${{ github.run_number }}" || true

      - name: Rollback frontend to blue
        run: |
          active_revisions=$(az containerapp revision list \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query "[?properties.active && !contains(name, 'green-${{ github.run_number }}')].name | [0]" -o tsv)

          if [ -n "$active_revisions" ]; then
            az containerapp ingress traffic set \
              --name ${{ secrets.FRONTEND_APP_NAME }} \
              --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
              --revision-weight "${active_revisions}=100"
          fi

          az containerapp revision deactivate \
            --name ${{ secrets.FRONTEND_APP_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --revision "${{ secrets.FRONTEND_APP_NAME }}--green-${{ github.run_number }}" || true

      - name: Report rollback
        run: echo "::error::Production deployment rolled back due to health check failure"

  tag-release:
    name: Tag Release
    runs-on: ubuntu-latest
    needs: traffic-shift
    steps:
      - uses: actions/checkout@v4

      - name: Create Git tag
        run: |
          git tag "${{ env.IMAGE_TAG }}"
          git push origin "${{ env.IMAGE_TAG }}"
