name: Deploy to AWS EKS

on:
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - ".github/workflows/deploy-aws-eks.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - staging
          - production

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: finshield-eks-cluster

jobs:
  build-push-ecr:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Git SHA (short)
        id: git-sha
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push backend
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git-sha.outputs.short-sha }}
        run: |
          docker build -t $ECR_REGISTRY/finshield-backend:$IMAGE_TAG \
            -t $ECR_REGISTRY/finshield-backend:latest \
            -f backend/Dockerfile ./backend
          docker push $ECR_REGISTRY/finshield-backend:$IMAGE_TAG
          docker push $ECR_REGISTRY/finshield-backend:latest
          echo "image=$ECR_REGISTRY/finshield-backend:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push frontend
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git-sha.outputs.short-sha }}
        run: |
          docker build -t $ECR_REGISTRY/finshield-frontend:$IMAGE_TAG \
            -t $ECR_REGISTRY/finshield-frontend:latest \
            -f frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/finshield-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/finshield-frontend:latest
          echo "image=$ECR_REGISTRY/finshield-frontend:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-push-ecr
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Install/upgrade Helm
        uses: azure/setup-helm@v3
        with:
          version: latest

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Build Kubernetes manifests
        run: |
          cd kubernetes
          kustomize build overlays/${{ github.event.inputs.environment || 'production' }} > final-manifest.yaml
          echo "Generated manifest:"
          cat final-manifest.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f kubernetes/final-manifest.yaml
          kubectl rollout status deployment/finshield-backend -n finshield --timeout=5m
          kubectl rollout status deployment/finshield-frontend -n finshield --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n finshield
          echo "=== Pod Status ==="
          kubectl get pods -n finshield
          echo "=== Services ==="
          kubectl get svc -n finshield

      - name: Run smoke tests
        run: |
          echo "Waiting for services to be ready..."
          kubectl wait --for=condition=ready pod \
            -l app=finshield-backend -n finshield --timeout=300s || true

          # Port forward and test
          kubectl port-forward -n finshield \
            svc/finshield-backend-service 8000:8000 &
          sleep 5

          curl -f http://localhost:8000/api/v1/health || exit 1
          echo "✓ Health check passed"

  rollback-eks:
    name: Rollback EKS on Failure
    runs-on: ubuntu-latest
    needs: deploy-eks
    if: failure()

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Rollback deployment
        run: |
          echo "Rolling back to previous version..."
          kubectl rollout undo deployment/finshield-backend -n finshield
          kubectl rollout undo deployment/finshield-frontend -n finshield
          kubectl rollout status deployment/finshield-backend -n finshield --timeout=5m
          echo "✓ Rollback completed"
