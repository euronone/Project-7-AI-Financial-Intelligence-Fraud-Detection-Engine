name: Deploy to Staging

on:
  push:
    branches: [staging, development_2]
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: cd-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY_BACKEND: finshield-backend
  ECR_REGISTRY_FRONTEND: finshield-frontend

jobs:
  # ── CI gate (runs for ALL triggers including Dependabot) ──────────────────
  ci:
    name: CI Gate (Build + Lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npx next lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/poetry.lock

      - name: Install Poetry
        run: pip install poetry

      - name: Install backend dependencies
        working-directory: backend
        run: poetry install --no-interaction

      - name: Lint backend
        run: poetry run ruff check backend/

  # ── AWS deploy (skipped for Dependabot — it cannot access secrets) ────────
  deploy-staging:
    name: Deploy to AWS Staging
    runs-on: ubuntu-latest
    needs: ci
    # Skip entirely when triggered by Dependabot (no secret access) or on PRs from forks
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get Git SHA (short)
        id: git-sha
        run: echo "short-sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & push backend image to ECR
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git-sha.outputs.short-sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REGISTRY_BACKEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REGISTRY_BACKEND:staging \
            -f backend/Dockerfile ./backend
          docker push $ECR_REGISTRY/$ECR_REGISTRY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REGISTRY_BACKEND:staging
          echo "image=$ECR_REGISTRY/$ECR_REGISTRY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build & push frontend image to ECR
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.git-sha.outputs.short-sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REGISTRY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REGISTRY_FRONTEND:staging \
            -f frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/$ECR_REGISTRY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REGISTRY_FRONTEND:staging
          echo "image=$ECR_REGISTRY/$ECR_REGISTRY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download backend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition finshield-backend-task \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition > task-def-backend.json

      - name: Render backend task definition with new image
        id: task-def-backend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-backend.json
          container-name: finshield-backend
          image: ${{ steps.build-backend.outputs.image }}

      - name: Deploy backend to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-backend.outputs.task-definition }}
          service: finshield-backend-service-staging
          cluster: finshield-cluster-staging
          wait-for-service-stability: true

      - name: Download frontend task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition finshield-frontend-task \
            --region ${{ env.AWS_REGION }} \
            --query taskDefinition > task-def-frontend.json

      - name: Render frontend task definition with new image
        id: task-def-frontend
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-def-frontend.json
          container-name: finshield-frontend
          image: ${{ steps.build-frontend.outputs.image }}

      - name: Deploy frontend to ECS staging
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-frontend.outputs.task-definition }}
          service: finshield-frontend-service-staging
          cluster: finshield-cluster-staging
          wait-for-service-stability: true

      - name: Verify staging health
        run: |
          echo "Verifying staging deployment..."
          max_attempts=20
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ secrets.STAGING_BACKEND_URL }}/api/v1/health || echo "000")
            if [ "$status" = "200" ]; then
              echo "✓ Staging backend healthy"
              exit 0
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts — HTTP $status"
            sleep 10
          done
          echo "✗ Staging health check timed out"
          exit 1

      - name: Post deployment summary
        if: success()
        run: |
          echo "### ✅ Staging Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ steps.git-sha.outputs.short-sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend image:** \`${{ steps.build-backend.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend image:** \`${{ steps.build-frontend.outputs.image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** finshield-cluster-staging" >> $GITHUB_STEP_SUMMARY
