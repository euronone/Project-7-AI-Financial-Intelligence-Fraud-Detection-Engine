name: CD - Staging

on:
  push:
    branches: [main]

concurrency:
  group: cd-staging
  cancel-in-progress: false

env:
  IMAGE_TAG: staging-${{ github.sha }}

jobs:
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      image-tag: ${{ env.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/finshield-backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=backend-staging
          cache-to: type=gha,mode=max,scope=backend-staging

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/finshield-frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=frontend-staging
          cache-to: type=gha,mode=max,scope=frontend-staging

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-push
    environment: staging
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy backend
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.BACKEND_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/finshield-backend:${{ needs.build-push.outputs.image-tag }}

      - name: Deploy frontend
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: ${{ secrets.FRONTEND_APP_NAME }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/finshield-frontend:${{ needs.build-push.outputs.image-tag }}

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging
    steps:
      - name: Wait for deployment to stabilize
        run: sleep 30

      - name: Health check - Backend
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.BACKEND_APP_NAME }}.${{ secrets.AZURE_CONTAINER_APP_DOMAIN }}/health" || true)
            if [ "$status" = "200" ]; then
              echo "Backend health check passed"
              exit 0
            fi
            echo "Attempt $i: status=$status, retrying in 10s..."
            sleep 10
          done
          echo "Backend health check failed after 10 attempts"
          exit 1

      - name: Health check - Frontend
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.FRONTEND_APP_NAME }}.${{ secrets.AZURE_CONTAINER_APP_DOMAIN }}/")
          if [ "$status" != "200" ]; then
            echo "Frontend health check failed with status $status"
            exit 1
          fi
          echo "Frontend health check passed"

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build-push, deploy, smoke-test]
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Staging Deployment: ${{ needs.smoke-test.result == 'success' && '✅ Success' || '❌ Failed' }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*FinShield AI - Staging Deployment*\n*Status:* ${{ needs.smoke-test.result == 'success' && '✅ Success' || '❌ Failed' }}\n*Commit:* `${{ github.sha }}`\n*Author:* ${{ github.actor }}\n*Image Tag:* `${{ needs.build-push.outputs.image-tag }}`"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
