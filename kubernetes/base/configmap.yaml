apiVersion: v1
kind: ConfigMap
metadata:
  name: finshield-config
  namespace: finshield
  labels:
    app: finshield
data:
  app-env: "production"
  log-level: "INFO"
  aws-region: "us-east-1"
  api-url: "https://api.finshield.ai/api/v1"

---
apiVersion: v1
kind: Secret
metadata:
  name: finshield-secrets
  namespace: finshield
  labels:
    app: finshield
type: Opaque
stringData:
  database-url: "postgresql+asyncpg://user:password@rds-endpoint:5432/finshield"
  jwt-secret: "your-jwt-secret-here"
  encryption-key: "your-encryption-key-here"
  redis-url: "redis://redis-endpoint:6379/0"
