apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finshield-ingress
  namespace: finshield
  labels:
    app: finshield
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  ingressClassName: alb
  rules:
  - host: finshield.ai
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: finshield-backend-service
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finshield-frontend-service
            port:
              number: 3000

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finshield-backend
  namespace: finshield

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finshield-frontend
  namespace: finshield
