apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finshield

resources:
  - base/namespace.yaml
  - base/backend-deployment.yaml
  - base/frontend-deployment.yaml
  - base/configmap.yaml
  - base/ingress.yaml

commonLabels:
  app: finshield
  managed-by: kustomize

commonAnnotations:
  deployment-tool: kustomize
  deployment-version: "1.0"
