AWSTemplateFormatVersion: '2010-09-09'
Description: 'EKS Cluster for FinShield'

Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
    Default: staging

  VpcId:
    Type: String
    Description: VPC ID

  PrivateSubnet1:
    Type: String
    Description: Private Subnet 1

  PrivateSubnet2:
    Type: String
    Description: Private Subnet 2

  PublicSubnet1:
    Type: String
    Description: Public Subnet 1

  PublicSubnet2:
    Type: String
    Description: Public Subnet 2

  NodeInstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large, m5.large, m5.xlarge]
    Description: EC2 instance type for worker nodes

Mappings:
  EnvConfig:
    staging:
      DesiredCapacity: 2
      MinCapacity: 2
      MaxCapacity: 5
    production:
      DesiredCapacity: 3
      MinCapacity: 3
      MaxCapacity: 10

Resources:
  # EKS Cluster IAM Role
  EKSClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'finshield-eks-cluster-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSVPCResourceController
      Tags:
        - Key: Name
          Value: !Sub 'finshield-eks-cluster-role-${Environment}'

  # EKS Cluster Security Group
  ClusterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS Cluster security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub 'finshield-eks-cluster-sg-${Environment}'

  # EKS Cluster
  EKSCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub 'finshield-eks-cluster-${Environment}'
      Version: '1.28'
      RoleArn: !GetAtt EKSClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
          - !Ref PublicSubnet1
          - !Ref PublicSubnet2
        SecurityGroupIds:
          - !Ref ClusterSecurityGroup
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
      Logging:
        ClusterLogging:
          - Enabled: true
            Types:
              - api
              - audit
              - authenticator
              - controllerManager
              - scheduler
      Tags:
        Name: !Sub 'finshield-eks-cluster-${Environment}'

  # Node Group IAM Role
  NodeGroupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'finshield-eks-node-group-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: EBSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:CreateVolume
                  - ec2:AttachVolume
                  - ec2:DetachVolume
                  - ec2:DeleteVolume
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub 'finshield-eks-node-group-role-${Environment}'

  # Node Group Security Group
  NodeGroupSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EKS Node Group security group
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 0
          ToPort: 65535
          SourceSecurityGroupId: !Ref ClusterSecurityGroup
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      Tags:
        - Key: Name
          Value: !Sub 'finshield-eks-node-group-sg-${Environment}'

  # Node Group
  NodeGroup:
    Type: AWS::EKS::NodeGroup
    Properties:
      ClusterName: !Ref EKSCluster
      NodeGroupName: !Sub 'finshield-node-group-${Environment}'
      NodeRole: !GetAtt NodeGroupRole.Arn
      Subnets:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      InstanceTypes:
        - !Ref NodeInstanceType
      DesiredSize: !FindInMap [EnvConfig, !Ref Environment, DesiredCapacity]
      MinSize: !FindInMap [EnvConfig, !Ref Environment, MinCapacity]
      MaxSize: !FindInMap [EnvConfig, !Ref Environment, MaxCapacity]
      DiskSize: 20
      Tags:
        Name: !Sub 'finshield-node-group-${Environment}'

  # OIDC Provider for IAM roles for service accounts (IRSA)
  OIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      ClientIdList:
        - sts.amazonaws.com
      Url: !Sub 'https://oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSCluster.EncryptionConfig.0.Provider.KeyArn}'
      ThumbprintList:
        - '9e99a48a9960b14926bb7f3b02e22da2b0ab7280'

  # CloudWatch Log Group for EKS Cluster Logs
  EKSClusterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/eks/finshield-${Environment}/cluster'
      RetentionInDays: 30

  # Metrics Server ServiceAccount Role
  MetricsServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'finshield-metrics-server-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSCluster.EncryptionConfig.0.Provider.KeyArn}'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                !Sub 'oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSCluster.EncryptionConfig.0.Provider.KeyArn}:sub': 'system:serviceaccount:kube-system:metrics-server'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

  # ALB Controller Role
  ALBControllerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'finshield-alb-controller-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSCluster.EncryptionConfig.0.Provider.KeyArn}'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                !Sub 'oidc.eks.${AWS::Region}.amazonaws.com/id/${EKSCluster.EncryptionConfig.0.Provider.KeyArn}:sub': 'system:serviceaccount:kube-system:aws-load-balancer-controller'
      Policies:
        - PolicyName: ALBControllerPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elbv2:CreateLoadBalancer
                  - elbv2:CreateTargetGroup
                  - elbv2:DescribeLoadBalancers
                  - elbv2:DescribeTargetGroups
                  - elbv2:ModifyLoadBalancerAttributes
                  - elbv2:ModifyTargetGroupAttributes
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeSubnets
                Resource: '*'

Outputs:
  ClusterName:
    Value: !Ref EKSCluster
    Export:
      Name: !Sub 'finshield-eks-cluster-name-${Environment}'
    Description: EKS Cluster Name

  ClusterArn:
    Value: !GetAtt EKSCluster.Arn
    Export:
      Name: !Sub 'finshield-eks-cluster-arn-${Environment}'
    Description: EKS Cluster ARN

  ClusterEndpoint:
    Value: !GetAtt EKSCluster.Endpoint
    Export:
      Name: !Sub 'finshield-eks-cluster-endpoint-${Environment}'
    Description: EKS Cluster Endpoint

  ClusterSecurityGroupId:
    Value: !Ref ClusterSecurityGroup
    Export:
      Name: !Sub 'finshield-eks-cluster-sg-${Environment}'
    Description: Cluster Security Group ID

  NodeGroupId:
    Value: !Ref NodeGroup
    Export:
      Name: !Sub 'finshield-eks-node-group-${Environment}'
    Description: Node Group ID

  NodeGroupRoleArn:
    Value: !GetAtt NodeGroupRole.Arn
    Export:
      Name: !Sub 'finshield-eks-node-group-role-arn-${Environment}'
    Description: Node Group IAM Role ARN
