[tool.poetry]
name = "finshield-backend"
version = "1.0.0"
description = "FinShield AI — Fraud Detection Engine Backend"
authors = ["FinShield Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.34.0", extras = ["standard"] }
pydantic = {extras = ["email"], version = "^2.12.5"}
pydantic-settings = "^2.9.0"
sqlalchemy = { version = "^2.0.41", extras = ["asyncio"] }
asyncpg = "^0.30.0"
alembic = "^1.16.1"
python-socketio = "^5.13.0"
structlog = "^25.0.0"
orjson = "^3.10.0"
redis = { version = "^5.2.0", extras = ["hiredis"] }
celery = { version = "^5.5.0", extras = ["redis"] }
python-jose = { version = "^3.5.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }
httpx = "^0.28.1"
# ML
scikit-learn = "^1.6.0"
xgboost = "^3.0.0"
numpy = "^2.0.0"
pandas = "^2.2.0"
shap = "^0.46.0"
onnxruntime = "^1.22.0"
# Azure integrations (optional — installed when deploying)
azure-eventhub = { version = "^5.13.0", optional = true }
azure-storage-blob = { version = "^12.25.0", optional = true }
azure-keyvault-secrets = { version = "^4.9.0", optional = true }
azure-identity = { version = "^1.21.0", optional = true }

[tool.poetry.extras]
azure = [
  "azure-eventhub",
  "azure-storage-blob",
  "azure-keyvault-secrets",
  "azure-identity",
]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.1.0"
httpx = "^0.28.1"
aiosqlite = "^0.21.0"
ruff = "^0.9.0"
mypy = "^1.15.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
